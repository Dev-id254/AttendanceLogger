<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="An interactive UI for the student logger." />

<title>CCT Project: Students' Attendance Logger</title>

<!--Link to the stylesheet-->
    <link rel="stylesheet" href="Dashboard.css">

</head>

<body>
  <div class="main_div">

    <header>
      <div class="brand">
        <div class="logo">
          <img alt="Maseno Logo" src="/PNGs/MSU Logo.png" height="60px" width="60px">
        </div>
        <div class="description_container">
          <div class="description">Maseno University</div>
          <div class="more_description">School of Computing and Informatics</div>
        </div>        
      </div>
      <nav>
        <ul>
          <li><a id="lec_mode" href="Dashboard.html">Lec Mode</a></li>
          <li><a href="Dashboard.html">Help</a></li>
          <li><a href="Dashboard.html">About</a></li>
        </ul>
      </nav>
    </header>

 <main>
  <section class="main_table">
        <div class="last_updated">
          <p>Last updated: <span id="lastTime">Date & Time</span></p>
        </div>
    <div class="table">
        <table>
            <caption>Attendance Log.</caption>
            <thead>
                <tr class="table_info">
                  <th>Index</th>
                  <th>Adm No</th>
                  <th>Timestamp</th>
                  <th>Info</th>
                </tr>
            </thead>
            <tbody id="attendance-body">
                <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
          <a href="#" class="page-ctrl">&laquo;</a>
          <a href="#" class="page">1</a>
          <a href="#" class="page">2</a>

    </div>
  </section>
 </main>

    <footer>
      © 2026 <u><em>CCT Y</u><sub>3</sub></em>
    </footer>
  </div>
